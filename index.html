<!DOCTYPE html> 
<html lang="pt-br"> 
<head> 
    <meta charset="UTF-8" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    <title>TechShop - Eletrônicos & Componentes</title> 
    <link rel="stylesheet" href="style.css">
</head> 
<body> 

    <header class="cabecalho"> 
        <h1>TechShop</h1> 
        <nav> 
            <a href="#celulares">Celulares</a> | 
            <a href="#pecas">Peças & Fontes</a> | 
            <a href="#ryzen">Ryzen</a> 
        </nav> 
    </header> 

    <main> 
        <h2>Nossos Produtos</h2> 
        
        <section id="celulares"> 
            <h3>Celulares</h3>
            <div class="grade-produtos">
                <article class="cartao"> 
                    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500" alt="Celular" class="cartao-imagem"> 
                    <p>Smartphone Premium X</p> 
                    <p class="preco">R$ 3.499,00</p>
                </article> 
            </div>
        </section> 

        <section id="pecas"> 
            <h3>Peças e Fontes</h3>
            <div class="grade-produtos">
                <article class="cartao"> 
                    <img src="https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=500" alt="Fonte ATX" class="cartao-imagem"> 
                    <p>Fonte ATX 750W 80 Plus</p> 
                    <p class="preco">R$ 450,00</p>
                </article> 
            </div>
        </section> 

        <section id="ryzen"> 
            <h3>Processadores Ryzen</h3>
            <div class="grade-produtos">
                <article class="cartao"> 
                    <img src="https://images.unsplash.com/photo-1591488320449-011701bb6704?w=500" alt="Processador Ryzen" class="cartao-imagem"> 
                    <p>AMD Ryzen 5 5600X</p> 
                    <p class="preco">R$ 1.200,00</p>
                </article> 
            </div>
        </section> 
    </main> 

    <footer> 
        <p>Projeto feito por [Seu Nome]</p> 
    </footer> 

</body> 
</html>
<script src="script.js" defer></script>
